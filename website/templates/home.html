<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="{{ message.tags }}">
                {{ message }}
            </li>
            {% endfor %}
        </ul>
    {% endif %}

    {% if user.is_authenticated %}
        <p>Hola, {{ user.username }} 👋 | <a href="{% url 'logout' %}">salir</a></p>
    {% else %}
        <p>Ud. no esta autenticado, lo puede hacer en <a href="{% url 'login' %}">login</a></p>
    {% endif %}
    <h1>Mi pagina principal</h1>
</body>
</html>
